# People
# ======
# Each record describes one person. They are sorted by last name.

# Person template: copy this block, remove its outer "# " prefix, and fill it in.
# Use unquoted null for absent optional values. Dates must be quoted YYYY-MM-DD.
#
# # Unique, stable identifier; preserve it once used in links or other data.
# - id: "last"
#   # Given name, preserving accents.
#   first_name: "First"
#   # Family name, including particles; entries are sorted by this field.
#   last_name: "Last"
#   # Display text with Markdown links; separate affiliations with semicolons.
#   affiliations: "[Unibo](https://www.unibo.it/)"
#   # Public professional contact address; null hides the email link.
#   email: null
#   # Personal or institutional HTTP(S) profile URL; null hides the link.
#   webpage: null
#   # DBLP PID without URL prefix or .html; null disables lookup.
#   dblp: null
#   # Portrait path relative to static/; null uses the default SVG.
#   # The global show_photos option controls whether photos appear.
#   photo: null
#   # List of research tags, e.g. ["lambda calculus", "type theory"].
#   interests: []
#   # Participation periods here; add entries for returns or status changes.
#   # Include earlier eligible periods for correct publication selection.
#   periods:
#     # Status key: permanent, postdoc, phd, visitor, or external.
#     - status: "phd"
#       # First day of this participation period; replace TODO before building.
#       arrival: "TODO"
#       # Last day of the period; null denotes an ongoing period.
#       departure: null

# - id: "last"
#   first_name: "First"
#   last_name: "Last"
#   affiliations: "[Unibo](https://www.unibo.it/)"
#   email: null
#   webpage: null
#   dblp: null
#   photo: null
#   interests: []
#   periods:
#     - status: "phd"
#       arrival: "TODO"
#       departure: null

