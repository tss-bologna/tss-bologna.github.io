# People
# ======
# Each record describes one person.
# Fields are documented alongside the first record; later records reuse them.
# Optional fields may be omitted.
#
# Current people are grouped by the status of their active period, then
# sorted by last name and first name.
# Former people have past periods but no active period.
# People with only future periods are not displayed yet.

# Stable identifier, also used as the person's HTML anchor.
# Use lowercase letters, digits, and hyphens. Do not change after publishing.
- id: davide-sangiorgi

  # Given name and surname, stored separately for sorting.
  first_name: "Davide"
  last_name: "Sangiorgi"

  # Display affiliations as Markdown, allowing links and arbitrary wording.
  # This text does not control publication selection.
  affiliations: >-
    Professor @ [Unibo](https://www.unibo.it/)

  # Optional email address. null means no email link.
  email: null

  # Optional personal webpage URL.
  webpage: "https://www.cs.unibo.it/~sangio/"

  # DBLP person identifier: the portion between /pid/ and .html.
  # null means no automatic publication fetching for this person.
  # Verified via the bibliography link on the personal webpage above.
  dblp: "s/DavideSangiorgi"

  # Optional portrait path relative to static/.
  # Example: "images/people/davide-sangiorgi.jpg".
  # Omitted or null uses the default SVG placeholder.
  # All portraits are hidden when site.show_photos is false.
  photo: null

  # Optional list of plain-text research tags. Default: [].
  # Tags are displayed without filtering controls.
  interests:
    - concurrency
    - semantics
    - verification

  # Periods of participation, including returns and changes of status.
  # Periods must not overlap for a given person.
  # Split a continuous stay into adjacent periods when status changes.
  periods:
    # Status identifier defined in site.yaml.
    - status: permanent

      # First included day, as a quoted ISO date.
      # EXAMPLE ONLY: replace with the actual arrival date.
      arrival: "2020-01-01"

      # Last included day, or null for an ongoing period.
      # A following adjacent period starts on the next calendar day.
      departure: null

