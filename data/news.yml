# News
# ====
# Each record describes one announcement. File order does not matter.
# Fields are documented alongside the first record.
#
# Home displays up to home_news_limit active items, newest first.
# An item is active when date <= today and expires is null or >= today.
# Dates are evaluated in the site's timezone at build time.
#
# If no items are active, Home hides both the news section and archive link.
# The archive includes all published items, including expired ones.
# Future-dated items appear neither on Home nor in the archive.
#
# These announcements are illustrative. Replace them before publication.

# Stable identifier, used as an anchor in /news/#website-preview.
- id: "website-preview"

  # Publication date, as a quoted ISO date. Required.
  date: "2026-09-14"

  # Last day the announcement may appear on Home, inclusive.
  # Optional; omitted or null means no expiry.
  # Expiry never removes an announcement from the archive.
  expires: "2026-12-31"

  # Required plain-text title.
  title: "Welcome to our website"

  # Required Markdown text.
  # Links use [label](URL). Mathematics uses $...$ or $$...$$.
  # >- joins wrapped lines; blank lines separate paragraphs.
  text: >-
    This example website brings together our research activities,
    people, publications, and seminar announcements.

